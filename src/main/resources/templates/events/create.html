<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head"></head>
<body class="container">

<h1>Create Event</h1>
<nav th:replace="fragments :: navigation"></nav>



<form method="post" action="/events/create" th:object="${event}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="form-group">
        <label>Name
            <input th:field="*{name}" class="form-control">
        </label>
        <p class="error" th:errors="*{name}"></p>
    </div>

    <div class="form-group">
        <label>Description
            <input th:field="*{eventDetails.description}" class="form-control">
        </label>
        <p class="error" th:errors="*{eventDetails.description}"></p>
    </div>

    <div class="form-group">
        <label>Contact Email
            <input th:field="*{eventDetails.contactEmail}" class="form-control">
        </label>
        <p class="error" th:errors="*{eventDetails.contactEmail}"></p>
    </div>

    <div class="form-group">
        <label>Category
            <select th:field="*{eventCategory}" class="form-control">
                <option value="">-- select category --</option>
                <option th:each="eventCategory : ${categories}"
                        th:value="${eventCategory.id}"
                        th:text="${eventCategory.name}">
                </option>
            </select>
        </label>
        <p class="error" th:errors="*{eventCategory}"></p>
    </div>

    <div class="form-group">
        <input type="submit" value="Create" class="btn btn-success">
    </div>
</form>
